edition: 3.0.0
name: stock-dashboard
access: default   # 对应 `s config add` 里配置的阿里云密钥别名

vars:
  region: cn-hangzhou              # 按需改：cn-hangzhou / cn-shanghai / ap-southeast-1(新加坡) 等
  functionName: stock-dashboard

resources:
  web:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: 短线操盘台（前端+12个API，FC3.0 自定义运行时 + OSS 存储）
      runtime: custom.debian10        # 自定义运行时（Debian10 内置多语言，用系统 node 或自带）
      cpu: 1
      memorySize: 2048                 # 2GB / 1vCPU：加速 SSE 流转、上游拉取与大 JSON 解析（原 0.5C/1G 偏低拖慢生成）
      diskSize: 512
      timeout: 600                     # ai/agent/daily_report 走 SSE 长连接 + 慢模型(军师 V4-Pro 常 47s+)，放到 FC 上限 600s，杜绝平台侧强杀导致的"生成超时"
      instanceConcurrency: 20          # 单实例并发（Web 函数支持多请求复用实例，省成本）
      caPort: 9000                     # 与 server.js 监听端口一致（FC 也会用 FC_SERVER_PORT 注入）
      code: ./.fc-package              # npm run package:fc 生成的最小运行包
      customRuntimeConfig:
        command:
          - /var/fc/lang/nodejs20/bin/node
          - server.js
      environmentVariables:
        # 让 PATH 包含内置 node，避免子进程找不到
        PATH: /var/fc/lang/nodejs20/bin:/usr/local/bin:/usr/bin:/bin
        ADVICE_FC_REGION: ${vars.region}
        ADVICE_FC_FUNCTION_NAME: ${vars.functionName}
        ADVICE_ASYNC_WORKER: "true"
        # ---- 大模型（保持原样，不迁百炼）----
        LLM_BASE_URL: ${env('LLM_BASE_URL')}
        LLM_API_KEY: ${env('LLM_API_KEY')}
        # 模型沿用代码内默认值（保持与线上一致）
        ADVISOR_MODEL: DeepSeek-V4-Pro
        REVIEW_MODEL: DeepSeek-V4-Pro
        PORTFOLIO_MODEL: DeepSeek-V4-Pro
        AGENT_MODEL: Qwen3-Max-A
        DAILY_MODEL: Qwen3-Max-A
        # ---- 第三方数据 ----
        FINNHUB_KEY: ${env('FINNHUB_KEY')}
        # 豆包搜索 Global版：军师个股/行业/舆情补盲，设 false 可立即停用。
        DOUBAO_SEARCH_API_KEY: ${env('DOUBAO_SEARCH_API_KEY')}
        DOUBAO_SEARCH_KEY_NAME: ${env('DOUBAO_SEARCH_KEY_NAME')}
        DOUBAO_SEARCH_ENABLED: "true"
        # 可选自托管 SearXNG；未配置时不发请求，不依赖公共实例。
        SEARXNG_ENABLED: ${env('SEARXNG_ENABLED')}
        SEARXNG_BASE_URL: ${env('SEARXNG_BASE_URL')}
        QUANT_URL: ${env('QUANT_URL')}
        QUANT_KEY: ${env('QUANT_KEY')}
        # ---- V2 分钟 Transformer（独立 EAS，可手动启停）----
        V2_QUANT_URL: ${env('V2_QUANT_URL')}
        V2_EAS_TOKEN: ${env('V2_EAS_TOKEN')}
        V2_API_KEY: ${env('V2_API_KEY')}
        AUTHORIZED_ACCOUNT_HASHES: ${env('AUTHORIZED_ACCOUNT_HASHES')}
        RUNTIME_CONFIG_ADMIN_HASHES: ${env('RUNTIME_CONFIG_ADMIN_HASHES')}
        V2_LAB_OSS_BUCKET: stock-quant-lab-1730034925594178
        V2_LAB_OSS_ENDPOINT: https://oss-cn-hangzhou-internal.aliyuncs.com
        # ---- OSS 存储（替代 Vercel Blob）----
        OSS_REGION: ${env('OSS_REGION')}
        OSS_BUCKET: ${env('OSS_BUCKET')}
        # FC 与 OSS 同在杭州，必须走内网；公网 Endpoint 会把每次 GetObject 计为 NetworkOut。
        OSS_ENDPOINT: https://oss-cn-hangzhou-internal.aliyuncs.com
        OSS_ALLOW_PUBLIC_NETWORK: "false"
        OSS_ACCESS_KEY_ID: ${env('OSS_ACCESS_KEY_ID')}
        OSS_ACCESS_KEY_SECRET: ${env('OSS_ACCESS_KEY_SECRET')}
        # ---- FC Timer / 云端任务鉴权口令 ----
        # Timer payload 与该值匹配后才允许进入 cron_advice / cron_alert / cron_v2_accuracy。
        CRON_KEY: ${env('CRON_KEY')}
        # 新备案域名设备授权码的 HMAC 摘要；签名密钥复用 CRON_KEY，明文授权码不入库。
        SITE_ACCESS_CODE_HMAC: "lowdmv8a1a48u9Bdws4_vjCHZReAjhhBsEx0ndSChFc"
        # 军师委员会仅影子运行；设为 false 可紧急关闭额外 LLM 调用。
        ADVISOR_COUNCIL_SHADOW: ${env('ADVISOR_COUNCIL_SHADOW')}
        # 策略人工晋级使用独立密钥；空值表示批准接口禁用。
        STRATEGY_APPROVAL_KEY: ${env('STRATEGY_APPROVAL_KEY')}
        # ---- Web Push(VAPID)：后台/关页面推送盯盘预警 ----
        # 公钥同时以 public/vapid.json 暴露给前端；私钥仅存服务端 env,绝不进前端/仓库。
        VAPID_PUBLIC_KEY: ${env('VAPID_PUBLIC_KEY')}
        VAPID_PRIVATE_KEY: ${env('VAPID_PRIVATE_KEY')}
        VAPID_SUBJECT: ${env('VAPID_SUBJECT')}
      # HTTP 触发器：对外提供访问地址（可再叠加 CDN/自定义域名做 HTTPS 加速）
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
              - PUT
              - OPTIONS
        - triggerName: advice-resume-timer
          triggerType: timer
          triggerConfig:
            cronExpression: "@every 5m"
            enable: true
            payload: ${env('CRON_KEY')}
        # 策略日报自动计划：每 5 分钟检查各账号设置，到期后异步分发独立 Worker。
        - triggerName: daily-report-schedule-timer
          triggerType: timer
          triggerConfig:
            cronExpression: "@every 5m"
            enable: true
            payload: ${env('CRON_KEY')}
        - triggerName: portfolio-analysis-resume-timer
          triggerType: timer
          triggerConfig:
            cronExpression: "@every 5m"
            enable: true
            payload: ${env('CRON_KEY')}
        - triggerName: sector-forecast-due-timer
          triggerType: timer
          triggerConfig:
            cronExpression: "@every 5m"
            enable: true
            payload: ${env('CRON_KEY')}
        # 尾盘拾金：14:50 自动正式扫描，14:52 仅作失败重试；幂等结果不重算。
        - triggerName: tail-pick-1450-timer
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 50,52 14 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
        - triggerName: v2-accuracy-timer
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 15 15 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
        # 持仓自动复盘：每场分段重复触发，未完成股票按租约续跑，页面关闭也不丢任务。
        - triggerName: review-noon-open
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 35,50 11 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
        - triggerName: review-noon-core
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 5,20,35,50 12 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
        - triggerName: review-close-open
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 5,20,35,50 15 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
        - triggerName: review-close-late
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 5,20,35,50 16 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
        # A股盯盘预警：工作日北京时间 09:30–11:30、13:00–15:00 每分钟触发。
        # 拆成 5 段可精确覆盖半小时时点，避免全天每分钟空调用。
        - triggerName: alert-market-am-open
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 30-59 9 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
        - triggerName: alert-market-am-core
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 * 10 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
        - triggerName: alert-market-am-close
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 0-30 11 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
        - triggerName: alert-market-pm-core
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 * 13-14 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
        - triggerName: alert-market-pm-close
          triggerType: timer
          triggerConfig:
            cronExpression: "CRON_TZ=Asia/Shanghai 0 0 15 * * 1-5"
            enable: true
            payload: ${env('CRON_KEY')}
      # 已备案生产域名。免费证书有效至 2026-11-15，续签后需更新 certId。
      customDomain:
        domainName: www.tedixtf.cn
        protocol: HTTP,HTTPS
        certConfig:
          certId: "26673093"
        tlsConfig:
          minVersion: TLSv1.2
          maxVersion: TLSv1.3
          cipherSuites:
            - TLS_RSA_WITH_AES_128_GCM_SHA256
            - TLS_RSA_WITH_AES_256_GCM_SHA384
            - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
            - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
            - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        route:
          qualifier: LATEST
          path: /*
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - HEAD
            - PATCH
            - OPTIONS
        authConfig:
          authType: anonymous
