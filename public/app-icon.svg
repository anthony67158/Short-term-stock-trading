<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>短线操盘台</title>
  <defs>
    <linearGradient id="background" x1="116" y1="72" x2="886" y2="948" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172233"/>
      <stop offset="0.44" stop-color="#0A1019"/>
      <stop offset="1" stop-color="#040609"/>
    </linearGradient>
    <radialGradient id="signal-aura" cx="0" cy="0" r="1" gradientTransform="matrix(340 -342 382 380 576 446)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1389ED" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#0874D8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0874D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cobalt" x1="266" y1="726" x2="758" y2="284" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0874D8"/>
      <stop offset="0.56" stop-color="#1389ED"/>
      <stop offset="1" stop-color="#5DBBFF"/>
    </linearGradient>
    <linearGradient id="silver" x1="302" y1="654" x2="720" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9C5D5"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6F2"/>
    </linearGradient>
    <filter id="mark-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.52"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#1389ED" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect id="background-shape" width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#signal-aura)"/>
  <g id="app-glyph" transform="translate(512 512) scale(1.14) translate(-512 -512)">
    <g id="signal-ring" fill="none" stroke-linecap="round">
      <path d="M260 510a252 252 0 0 1 414-190" stroke="#24364F" stroke-width="28"/>
      <path d="M756 514a252 252 0 0 1-406 202" stroke="#0874D8" stroke-width="28"/>
      <circle cx="286" cy="597" r="20" fill="#1389ED" stroke="none"/>
      <circle cx="712" cy="405" r="20" fill="#DCE6F2" stroke="none"/>
    </g>
    <g id="market-bars" opacity="0.92">
      <rect x="300" y="468" width="54" height="176" rx="18" fill="#203B5F"/>
      <rect x="430" y="382" width="54" height="194" rx="18" fill="#0D65BC"/>
      <rect x="560" y="296" width="54" height="202" rx="18" fill="#1389ED"/>
    </g>
