<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS 不支持 SVG 的 apple-touch-icon,必须提供 PNG,否则会退化为"首字母(操)"图标 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="操盘台" />
    <meta name="theme-color" content="#7C6BF5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e12" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="短线操盘台 · A股短线 / 做T 交易决策系统" />
    <title>短线操盘台 · 资金流向短线看板</title>
    <style>
      /* D-15 PWA 启动闪屏:随 HTML 立即呈现,React 挂载后由 #root 内容覆盖并淡出,消除白屏 */
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #0e0e12; color: #e8e8ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        transition: opacity .32s ease;
      }
      #app-splash.hide { opacity: 0; pointer-events: none; }
      #app-splash .sp-logo {
        width: 68px; height: 68px; border-radius: 18px;
        box-shadow: 0 12px 40px rgba(124,107,245,.32);
        animation: spPulse 1.6s ease-in-out infinite;
      }
      #app-splash .sp-name { font-size: 16px; font-weight: 650; letter-spacing: .5px; }
      #app-splash .sp-sub { font-size: 12px; color: #8a8a99; margin-top: -8px; }
      #app-splash .sp-bar { width: 132px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
      #app-splash .sp-bar::before { content: ""; display: block; height: 100%; width: 40%; border-radius: 2px;
        background: linear-gradient(90deg, #7C6BF5, #5B8DEF); animation: spSlide 1.1s ease-in-out infinite; }
      @keyframes spPulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.06); opacity: .88 } }
      @keyframes spSlide { 0% { transform: translateX(-120%) } 100% { transform: translateX(320%) } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .sp-logo, #app-splash .sp-bar::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img class="sp-logo" src="/favicon.svg" alt="" width="68" height="68" />
        <div class="sp-name">短线操盘台</div>
        <div class="sp-sub">正在加载行情与持仓…</div>
        <div class="sp-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
