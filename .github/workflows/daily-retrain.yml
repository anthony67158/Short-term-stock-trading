# 每日量化增量训练（新增成熟样本适配 + 独立盲测晋级）
# 触发：北京时间工作日 01:15（UTC 前一日 17:15）+ 手动。
# 机制：拉最新日线→新增成熟样本进入适配窗→最新日期保留为盲测窗→多指标提升才晋级→上传 OSS。
#       量化服务 model_lib 每 1h 从 OSS 热更新，故上传即上线，无需重部署 FC。
name: daily-retrain

on:
  schedule:
    # UTC 周日至周四 17:15 = 北京时间周一至周五 01:15。
    # 避开整点和半点，降低 GitHub Actions 定时任务拥堵延迟。
    - cron: "15 17 * * 0-4"
  workflow_dispatch: {}       # 支持手动触发

concurrency:
  group: daily-retrain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qlib-service
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_DEFAULT_TIMEOUT: "90"
    steps:
      - uses: actions/checkout@v6

      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: qlib-service/requirements-ci.txt

      - name: Install locked training dependencies
        run: |
          python -m pip install --retries 5 -r requirements-ci.txt
          python -m pip check

      - name: Verify incremental training and forecast contracts
        shell: bash
        run: |
          mkdir -p ../test-artifacts
          set -o pipefail
          python -m unittest \
            test_retrain_daily.py \
            test_build_dataset_forecast.py \
            test_production_backtest.py \
            test_app_forecast.py \
            test_publish_retrain_report.py \
            test_model_lib_dense_runtime.py \
            test_model_release.py \
            tests/test_factor_research_v2.py \
            test_sector_factors.py \
            test_sector_model.py \
            test_train_sector_model.py \
            test_build_sector_dataset.py \
            test_sector_app.py \
            2>&1 | tee ../test-artifacts/retrain-contract-tests.log

      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrain-contract-tests-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: warn

  stock-retrain:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: qlib-service
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_DEFAULT_TIMEOUT: "90"
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      OSS_ALLOW_PUBLIC_NETWORK: "true"
      OSS_REGION: oss-cn-hangzhou
      QUANT_MODEL_PREFIX: quantmodel/
    steps:
      - uses: actions/checkout@v6

      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: qlib-service/requirements-ci.txt

      - name: Install locked training dependencies
        run: |
          python -m pip install --retries 5 -r requirements-ci.txt
          python -m pip check

      - name: Verify required OSS configuration
        run: |
          missing=0
          for name in \
            OSS_ACCESS_KEY_ID \
            OSS_ACCESS_KEY_SECRET \
            OSS_BUCKET
          do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Actions secret::$name 未配置"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify stock model OSS connectivity
        run: |
          python - <<'PY'
          from upload_model import bucket
          meta = bucket().head_object("quantmodel/meta.json")
          if int(meta.content_length or 0) <= 0:
              raise RuntimeError("quantmodel/meta.json is empty")
          print("[preflight] stock model OSS reachable")
          PY

      - name: Preflight - 行情数据源连通性自检
        id: preflight
        run: |
          python - <<'PY'
          import urllib.request
          H={'User-Agent':'Mozilla/5.0','Referer':'https://finance.sina.com.cn/'}
          def ok(u):
              try:
                  return len(urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=20).read())>50
              except Exception as e:
                  print('  probe fail:', u.split('?')[0], repr(e)); return False
          sina=ok('https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData?page=1&num=3&sort=amount&asc=0&node=hs_a')
          tx=ok('https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=sh600000,day,,,60,qfq')
          print(f'[preflight] sina={sina}(仅参考) tencent={tx}(硬性)')
          open('preflight.txt','w').write('ok' if tx else 'skip')
          PY
          echo "reachable=$(cat preflight.txt)" >> "$GITHUB_OUTPUT"

      - name: Run champion-challenger retrain
        if: steps.preflight.outputs.reachable == 'ok'
        run: python retrain_daily.py --pool 600 --bars 700 --horizon 5

      - name: Skip notice (数据源不可达)
        if: steps.preflight.outputs.reachable != 'ok'
        run: echo "::warning::行情数据源(新浪/腾讯 CN)在本次 CI 出口 IP 下不可达,已跳过当日重训(线上保持冠军不变,非代码故障)。"

      - name: Publish retrain decision
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          history = "retrain_history.jsonl"
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          if not os.path.exists(history):
              lines = [
                  "## 每日重训结果",
                  "",
                  "本次未生成训练审计记录。若 Preflight 显示数据源不可达，则本次为安全跳过。",
              ]
          else:
              with open(history, encoding="utf-8") as fh:
                  records = [json.loads(line) for line in fh if line.strip()]
              rec = records[-1]
              fields = [
                  ("决策", rec.get("decision", "unknown")),
                  ("原因", rec.get("reason", "-")),
                  ("样本数", rec.get("n_samples", "-")),
                  ("冠军 AUC", rec.get("champ_baseline_auc", "-")),
                  ("挑战者 AUC", rec.get("chall_holdout_auc", "-")),
                  ("增量适配样本", rec.get("adapt_n", "-")),
                  ("独立盲测样本", rec.get("blind_n", "-")),
                  ("晋级增益", "、".join((rec.get("metric_gate") or {}).get("improvements") or []) or "-"),
                  ("OSS 已上传", rec.get("oss_uploaded", "-")),
                  ("信号头决策", rec.get("signal_decision", "-")),
              ]
              lines = ["## 每日重训结果", "", "| 项目 | 结果 |", "|---|---|"]
              lines.extend(f"| {name} | {value} |" for name, value in fields)
              print(json.dumps(rec, ensure_ascii=False))
          with open(summary, "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Publish result to in-app quant report
        if: always()
        continue-on-error: true
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RETRAIN_JOB_STATUS: ${{ job.status }}
          RETRAIN_PREFLIGHT: ${{ steps.preflight.outputs.reachable }}
        run: python publish_retrain_report.py

      - name: Upload stock retrain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stock-retrain-${{ github.run_id }}
          path: |
            qlib-service/retrain_history.jsonl
            qlib-service/dataset_build_meta.json
            qlib-service/production_accuracy.json
          if-no-files-found: warn

  sector-retrain:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: qlib-service
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_DEFAULT_TIMEOUT: "90"
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      OSS_ALLOW_PUBLIC_NETWORK: "true"
      OSS_REGION: oss-cn-hangzhou
      SECTOR_MODEL_PREFIX: sectormodel/
    steps:
      - uses: actions/checkout@v6

      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: qlib-service/requirements-ci.txt

      - name: Install locked training dependencies
        run: |
          python -m pip install --retries 5 -r requirements-ci.txt
          python -m pip check

      - name: Verify required training secrets
        run: |
          missing=0
          for name in \
            TUSHARE_TOKEN \
            OSS_ACCESS_KEY_ID \
            OSS_ACCESS_KEY_SECRET \
            OSS_BUCKET
          do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Actions secret::$name 未配置"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify sector model OSS connectivity
        run: |
          python - <<'PY'
          from upload_model import bucket
          meta = bucket().head_object("sectormodel/meta.json")
          if int(meta.content_length or 0) <= 0:
              raise RuntimeError("sectormodel/meta.json is empty")
          print("[preflight] sector model OSS reachable")
          PY

      - name: Restore sector history cache
        uses: actions/cache@v5
        with:
          path: qlib-service/sector_raw_cache.json.gz
          key: sector-raw-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            sector-raw-${{ runner.os }}-

      - name: Preflight - Tushare板块数据源
        id: sector-preflight
        run: |
          python - <<'PY'
          import datetime as dt
          import urllib.error
          from tushare_client import TushareClient

          state = "skip"
          try:
              end = dt.date.today()
              start = end - dt.timedelta(days=14)
              rows = TushareClient(timeout=20, retries=1).trade_cal(
                  start_date=start.strftime("%Y%m%d"),
                  end_date=end.strftime("%Y%m%d"),
              )
              state = "ok" if rows else "skip"
              print(f"[preflight] tushare rows={len(rows)}")
          except urllib.error.HTTPError as error:
              if error.code not in (408, 425, 429, 500, 502, 503, 504):
                  raise
              print(
                  "::warning title=Tushare preflight failed::"
                  + str(error)[:180]
              )
          except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
              print(
                  "::warning title=Tushare preflight failed::"
                  + str(error)[:180]
              )
          with open("sector_preflight.txt", "w") as handle:
              handle.write(state)
          PY
          echo "reachable=$(cat sector_preflight.txt)" >> "$GITHUB_OUTPUT"

      - name: Build incremental sector dataset
        if: steps.sector-preflight.outputs.reachable == 'ok'
        shell: bash
        run: |
          status=1
          for attempt in 1 2 3; do
            if python build_sector_dataset.py --start-date 20230911; then
              status=0
              break
            fi
            echo "::warning::板块数据更新第 ${attempt} 次失败，准备重试"
            sleep $((attempt * 20))
          done
          exit "$status"

      - name: Skip sector retrain (数据源不可达)
        if: steps.sector-preflight.outputs.reachable != 'ok'
        run: echo "::warning::Tushare本轮不可达，已安全保留现役板块冠军"

      - name: Run sector champion-challenger retrain
        if: steps.sector-preflight.outputs.reachable == 'ok'
        shell: bash
        run: |
          set -o pipefail
          python train_sector_model.py |
            tee sector_retrain_result.json

      - name: Upload sector retrain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sector-retrain-${{ github.run_id }}
          path: |
            qlib-service/sector_retrain_result.json
            qlib-service/sector_meta.json
            qlib-service/sector_hard_errors.json
          if-no-files-found: warn
