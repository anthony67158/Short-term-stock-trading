name: daily-learning-challengers

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLATFORM_MARKET_DATA_ENABLED: "true"
      PLATFORM_MARKET_DATA_API_KEY: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Probe historical data capabilities
        run: |
          mkdir -p audit-output
          python3 <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          token = os.environ["PLATFORM_MARKET_DATA_API_KEY"]
          daily_fields = "ts_code,trade_date,open,high,low,close,pre_close,vol,amount"
          minute_fields = "ts_code,trade_time,open,close,high,low,vol,amount"
          stock_fields = (
              "ts_code,symbol,name,market,exchange,list_status,list_date,delist_date"
          )

          probes = (
              ("stock_basic", {"ts_code": "600519.SH", "list_status": "L"}, stock_fields),
              ("trade_cal", {"exchange": "SSE", "start_date": "20250901", "end_date": "20250905"},
               "exchange,cal_date,is_open,pretrade_date"),
              ("daily", {"ts_code": "600519.SH", "start_date": "20250901", "end_date": "20250905"},
               daily_fields),
              ("adj_factor", {"ts_code": "600519.SH", "start_date": "20250901",
                              "end_date": "20250905"}, "ts_code,trade_date,adj_factor"),
              ("stk_mins", {"ts_code": "600519.SH", "freq": "5min",
                            "start_date": "2025-09-01 09:30:00",
                            "end_date": "2025-09-05 15:00:00"}, minute_fields),
          )
          endpoints = (
              "https://api.tushare.pro",
              "https://ts.gyzcloud.top/api",
          )
          report = {"schemaVersion": "market-data-capability-probe.v1", "endpoints": []}
          for endpoint in endpoints:
              result = {"endpoint": endpoint, "probes": []}
              for api_name, params, fields in probes:
                  started = time.monotonic()
                  try:
                      body = json.dumps({
                          "api_name": api_name,
                          "token": token,
                          "params": params,
                          "fields": fields,
                      }).encode()
                      request = urllib.request.Request(
                          endpoint,
                          data=body,
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )
                      with urllib.request.urlopen(request, timeout=40) as response:
                          payload = json.loads(response.read())
                      if payload.get("code") != 0:
                          raise RuntimeError(f"API_CODE_{payload.get('code')}")
                      data = payload.get("data") or {}
                      columns = data.get("fields")
                      items = data.get("items")
                      if not isinstance(columns, list) or not isinstance(items, list):
                          raise RuntimeError("RESPONSE_INVALID")
                      rows = [dict(zip(columns, item, strict=True)) for item in items]
                      canonical = json.dumps(
                          rows,
                          ensure_ascii=False,
                          sort_keys=True,
                          separators=(",", ":"),
                      ).encode()
                      result["probes"].append({
                          "apiName": api_name,
                          "status": "OK",
                          "rows": len(rows),
                          "elapsedSeconds": round(time.monotonic() - started, 3),
                          "payloadSha256": hashlib.sha256(canonical).hexdigest(),
                      })
                  except Exception as error:
                      code = (
                          f"HTTP_{error.code}"
                          if isinstance(error, urllib.error.HTTPError)
                          else type(error).__name__
                      )
                      result["probes"].append({
                          "apiName": api_name,
                          "status": "ERROR",
                          "elapsedSeconds": round(time.monotonic() - started, 3),
                          "errorCode": code,
                      })
              report["endpoints"].append(result)
          with open("audit-output/probe.json", "w", encoding="utf-8") as stream:
              json.dump(report, stream, ensure_ascii=False, sort_keys=True, indent=2)
              stream.write("\n")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: market-data-capability-probe-${{ github.run_id }}
          path: audit-output/probe.json
          if-no-files-found: error
          retention-days: 1
