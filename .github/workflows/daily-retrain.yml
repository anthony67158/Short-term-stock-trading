name: action-value-sealed-train

on:
  workflow_dispatch: {}

concurrency:
  group: action-value-sealed-train
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_DEFAULT_TIMEOUT: "90"
      OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      PLATFORM_MARKET_DATA_ENABLED: "true"
      PLATFORM_MARKET_DATA_BASE_URL: https://api.tushare.pro
      PLATFORM_MARKET_DATA_API_KEY: ${{ secrets.TUSHARE_TOKEN }}
      PLATFORM_MARKET_DATA_TIMEOUT_SECONDS: "60"
      DATA_ROOT: /mnt/action-value-data
      MARKET_ID: action-value-market-20240102-20260918-v1
      RANKING_ID: action-value-ranking-20240102-20260918-v1
      EPISODE_ID: action-value-episodes-20240401-20260911-v1
      LABEL_ID: action-value-labels-20240401-20260911-v1
      FACTOR_ID: action-value-factors-20240401-20260911-v1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked training dependencies
        working-directory: backend
        run: uv sync --frozen --group ops --group action-value --dev

      - name: Verify data, model and account contracts
        working-directory: backend
        run: |
          uv run --group ops --group action-value pytest \
            tests/test_label_dataset.py \
            tests/test_action_value_training.py \
            tests/test_action_value_validation.py \
            tests/test_action_value_models.py \
            tests/test_action_value_evaluation.py \
            tests/test_action_value_walk_forward.py \
            tests/test_action_value_artifact_store.py \
            tests/test_action_value_factor_dataset.py \
            tests/test_multifactor_features.py \
            tests/test_multifactor_source.py \
            tests/test_account_backtest.py \
            -q
          uv run --group ops --group action-value ruff check \
            src/platform_app/modules/experiments/action_value_*.py \
            src/platform_app/modules/experiments/multifactor_*.py \
            src/platform_app/modules/experiments/account_backtest.py

      - name: Restore sealed training datasets
        working-directory: backend
        run: |
          sudo mkdir -p "$DATA_ROOT"
          sudo chown "$USER:$USER" "$DATA_ROOT"
          for spec in \
            "market:$MARKET_ID" \
            "ranking:$RANKING_ID" \
            "episode:$EPISODE_ID"
          do
            kind="${spec%%:*}"
            dataset_id="${spec#*:}"
            uv run --group ops python -m \
              platform_app.modules.experiments.retraining_dataset_store restore \
              --root "$DATA_ROOT/$kind" \
              --scope full \
              --kind "$kind" \
              --dataset-id "$dataset_id"
            test -f "$DATA_ROOT/$kind/manifest.json"
          done
          uv run --group ops python -m \
            platform_app.modules.experiments.retraining_dataset_store restore \
            --root "$DATA_ROOT/label" \
            --scope full \
            --kind label \
            --dataset-id "$LABEL_ID" \
            --output "$RUNNER_TEMP/label-restore.json"

      - name: Audit restored sealed label dataset
        working-directory: backend
        run: |
          uv run --group ops python -m \
            platform_app.modules.experiments.retraining_dataset_store audit \
            --root "$DATA_ROOT/label" \
            --scope full \
            --kind label \
            --dataset-id "$LABEL_ID" \
            --output "$RUNNER_TEMP/label-final.json"
          DATA_ROOT="$DATA_ROOT" uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["DATA_ROOT"])
          episode = json.loads((root / "episode" / "manifest.json").read_text())
          label = json.loads((root / "label" / "manifest.json").read_text())
          if label["partitions"] != 596:
              raise SystemExit("LABEL_PARTITION_COVERAGE_INCOMPLETE")
          if label["labels"]["episodes"] != episode["coverage"]["episodes"]["eligible"]:
              raise SystemExit("LABEL_EPISODE_COVERAGE_MISMATCH")
          if label["labels"]["scenarios"] < 200_000:
              raise SystemExit("LABEL_SCENARIO_COVERAGE_INSUFFICIENT")
          if set(label["labelsByBoard"]) != {
              "MAIN", "CHINEXT", "STAR", "BEIJING"
          }:
              raise SystemExit("LABEL_BOARD_COVERAGE_INCOMPLETE")
          PY

      - name: Restore sealed factor dataset when present
        id: restore-factor
        working-directory: backend
        run: |
          uv run --group ops python -m \
            platform_app.modules.experiments.retraining_dataset_store restore \
            --root "$DATA_ROOT/factor" \
            --scope full \
            --kind factor \
            --dataset-id "$FACTOR_ID" \
            --output "$RUNNER_TEMP/factor-restore.json"
          status="$(jq -r .status "$RUNNER_TEMP/factor-restore.json")"
          if [ "$status" = "RESTORED" ]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build immutable point-in-time factor sources
        if: steps.restore-factor.outputs.restored != 'true'
        working-directory: backend
        run: |
          uv run python -m \
            platform_app.modules.experiments.action_value_factor_dataset \
            build-source \
            --root "$DATA_ROOT/factor-source" \
            --episode-root "$DATA_ROOT/episode" \
            --workers 4
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from platform_app.modules.experiments.multifactor_source import (
              audit_multifactor_source_archive,
          )

          root = Path(os.environ["DATA_ROOT"]) / "factor-source"
          report = audit_multifactor_source_archive(root)
          if report["state"] != "READY":
              raise SystemExit("ACTION_VALUE_FACTOR_SOURCE_NOT_READY")
          Path(os.environ["RUNNER_TEMP"], "factor-source-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2)
              + "\n"
          )
          PY

      - name: Build and checkpoint sealed factor dataset
        if: steps.restore-factor.outputs.restored != 'true'
        working-directory: backend
        run: |
          uv run python -m \
            platform_app.modules.experiments.action_value_factor_dataset \
            build-dataset \
            --root "$DATA_ROOT/factor" \
            --dataset-id "$FACTOR_ID" \
            --source-root "$DATA_ROOT/factor-source" \
            --episode-root "$DATA_ROOT/episode" \
            --ranking-root "$DATA_ROOT/ranking" \
            --market-root "$DATA_ROOT/market"
          uv run --group ops python -m \
            platform_app.modules.experiments.retraining_dataset_store checkpoint \
            --root "$DATA_ROOT/factor" \
            --scope full \
            --kind factor \
            --dataset-id "$FACTOR_ID" \
            --output "$RUNNER_TEMP/factor-checkpoint.json"

      - name: Audit sealed factor dataset
        working-directory: backend
        run: |
          uv run --group ops python -m \
            platform_app.modules.experiments.retraining_dataset_store audit \
            --root "$DATA_ROOT/factor" \
            --scope full \
            --kind factor \
            --dataset-id "$FACTOR_ID" \
            --output "$RUNNER_TEMP/factor-final.json"
          cp "$DATA_ROOT/factor/manifest.json" \
            "$RUNNER_TEMP/factor-manifest.json"

      - name: Run nested action-value walk-forward
        working-directory: backend
        run: |
          rm -rf "$DATA_ROOT/experiment"
          uv run --group action-value platform-cli \
            evaluate-action-value-walk-forward \
            --episode-root "$DATA_ROOT/episode" \
            --label-root "$DATA_ROOT/label" \
            --ranking-root "$DATA_ROOT/ranking" \
            --output "$DATA_ROOT/experiment" \
            --max-iterations 200

      - name: Upload immutable experiment
        working-directory: backend
        run: |
          uv run --group ops --group action-value python -m \
            platform_app.modules.experiments.action_value_artifact_store upload \
            --root "$DATA_ROOT/experiment" \
            --output "$RUNNER_TEMP/experiment-receipt.json"
          cp "$DATA_ROOT/experiment/manifest.json" \
            "$RUNNER_TEMP/experiment-manifest.json"
          cp "$DATA_ROOT/experiment/evaluation.json" \
            "$RUNNER_TEMP/experiment-evaluation.json"

      - name: Enforce development gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["DATA_ROOT"]) / "experiment" / "manifest.json").read_text()
          )
          if not manifest["gate"]["passed"]:
              raise SystemExit(
                  "ACTION_VALUE_DEVELOPMENT_GATE_REJECTED:"
                  + ",".join(manifest["gate"]["failedChecks"])
              )
          PY

      - name: Run strict OOF four-account replay
        working-directory: backend
        run: |
          uv run --group action-value platform-cli \
            evaluate-action-value-account-backtest \
            --action-value-experiment-root "$DATA_ROOT/experiment" \
            --dataset-root "$DATA_ROOT/market" \
            --episode-root "$DATA_ROOT/episode" \
            --label-root "$DATA_ROOT/label" \
            --ranking-root "$DATA_ROOT/ranking" \
            --output "$DATA_ROOT/action-value-account-backtest.json"
          cp "$DATA_ROOT/action-value-account-backtest.json" \
            "$RUNNER_TEMP/action-value-account-backtest.json"
          uv run --group ops --group action-value python -m \
            platform_app.modules.experiments.action_value_artifact_store \
            upload-account-report \
            --root "$DATA_ROOT/experiment" \
            --evidence "$DATA_ROOT/action-value-account-backtest.json" \
            --output "$RUNNER_TEMP/account-receipt.json"

      - name: Enforce account gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(
                  os.environ["DATA_ROOT"],
                  "action-value-account-backtest.json",
              ).read_text()
          )
          if not report["capacityGate"]["passed"]:
              raise SystemExit("ACTION_VALUE_ACCOUNT_GATE_REJECTED")
          PY

      - name: Upload training diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: action-value-sealed-train-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/label-restore.json
            ${{ runner.temp }}/label-final.json
            ${{ runner.temp }}/factor-restore.json
            ${{ runner.temp }}/factor-source-audit.json
            ${{ runner.temp }}/factor-checkpoint.json
            ${{ runner.temp }}/factor-final.json
            ${{ runner.temp }}/factor-manifest.json
            ${{ runner.temp }}/experiment-receipt.json
            ${{ runner.temp }}/experiment-manifest.json
            ${{ runner.temp }}/experiment-evaluation.json
            ${{ runner.temp }}/action-value-account-backtest.json
            ${{ runner.temp }}/account-receipt.json
            /mnt/action-value-data/factor-source/
          if-no-files-found: warn
          retention-days: 30
