name: multifactor-stock-pick-retrain

run-name: Manual local CPU training · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID generated by the protected training API
        required: true
        type: string
      publish_direct_dev:
        description: Publish from an Alibaba Cloud intranet runner only
        required: true
        type: boolean
        default: false
      iterations:
        description: LightGBM boosting iterations
        required: true
        type: number
        default: 160
      max_snapshot_mb:
        description: Maximum DIRECT_DEV snapshot upload size in MiB
        required: true
        type: number
        default: 8

concurrency:
  group: multifactor-stock-pick-retrain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retrain:
    runs-on: [self-hosted, stock-model-training]
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ vars.TRAINING_WORKSPACE_ROOT }}/backend/src
      WORKSPACE_ROOT: ${{ vars.TRAINING_WORKSPACE_ROOT }}
      SOURCE_ROOT: ${{ vars.MULTIFACTOR_SOURCE_ROOT }}
      SCENARIO_ROOT: ${{ vars.STOCK_PICK_SCENARIO_ROOT }}
      MARKET_ROOT: ${{ vars.STOCK_PICK_MARKET_ROOT }}
      TRAINING_RUNNER_LOCATION: ${{ vars.TRAINING_RUNNER_LOCATION }}
      OSS_ENDPOINT: ${{ vars.TRAINING_OSS_INTERNAL_ENDPOINT }}
      PLATFORM_MARKET_DATA_ENABLED: "true"
      PLATFORM_MARKET_DATA_BASE_URL: ${{ vars.PLATFORM_MARKET_DATA_BASE_URL }}
      PLATFORM_MARKET_DATA_API_KEY: ${{ secrets.PLATFORM_MARKET_DATA_API_KEY }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.17
          enable-cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enforce local-input and intranet-publication budget
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "self-hosted"
          for path in \
            "$WORKSPACE_ROOT" \
            "$SOURCE_ROOT" \
            "$SCENARIO_ROOT" \
            "$MARKET_ROOT"; do
            test -n "$path"
            test -d "$path"
          done
          test -f "$WORKSPACE_ROOT/backend/pyproject.toml"
          test -f "$WORKSPACE_ROOT/backend/uv.lock"
          test -f "$WORKSPACE_ROOT/package-lock.json"
          test -f "$MARKET_ROOT/market.sqlite3"
          test -f "$SCENARIO_ROOT/universe.json.gz"
          model_store="$HOME/.local/share/stock-platform/multifactor-model-runs"
          MODEL_RUN_ROOT="$model_store/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$MODEL_RUN_ROOT"
          mkdir -p "$model_store"
          echo "MODEL_RUN_ROOT=$MODEL_RUN_ROOT" >> "$GITHUB_ENV"
          if [ "${{ inputs.publish_direct_dev }}" = "true" ]; then
            test "$TRAINING_RUNNER_LOCATION" = "ALIYUN_HANGZHOU"
            case "$OSS_ENDPOINT" in
              https://oss-*-internal.aliyuncs.com) ;;
              *) echo "DIRECT_DEV publication requires an OSS intranet endpoint" >&2; exit 1 ;;
            esac
          fi

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project "$WORKSPACE_ROOT/backend" --frozen
          cd "$WORKSPACE_ROOT"
          npm ci --prefer-offline --no-audit --fund=false

      - name: Verify multifactor contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE_ROOT/backend"
          uv run pytest -q \
            tests/test_multifactor_dataset.py \
            tests/test_multifactor_features.py \
            tests/test_multifactor_training.py \
            tests/test_multifactor_snapshot.py \
            tests/test_multifactor_release.py

      - name: Build current six-factor features
        id: current_features
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE_ROOT"
          mkdir -p "$RUNNER_TEMP/multifactor-run/current"
          uv run --project backend python \
            backend/scripts/build_multifactor_daily_features.py \
            --source-root "$SOURCE_ROOT" \
            --market-root "$MARKET_ROOT" \
            --output "$RUNNER_TEMP/multifactor-run/current/features.npz" \
            --cache-root "$HOME/.local/share/stock-platform/multifactor-daily-cache" \
            | tee "$RUNNER_TEMP/multifactor-run/current/report.json"
          status="$(jq -r '.status' "$RUNNER_TEMP/multifactor-run/current/report.json")"
          echo "ready=$([ "$status" = "READY" ] && echo true || echo false)" \
            >> "$GITHUB_OUTPUT"
          if [ "$status" = "READY" ]; then
            echo "decision_date=$(jq -r '.decisionDate' "$RUNNER_TEMP/multifactor-run/current/report.json")" \
              >> "$GITHUB_OUTPUT"
            echo "factor_date=$(jq -r '.factorDate' "$RUNNER_TEMP/multifactor-run/current/report.json")" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Build point-in-time historical factors
        if: steps.current_features.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE_ROOT/backend"
          uv run python scripts/build_multifactor_factor_dataset.py \
            --source-root "$SOURCE_ROOT" \
            --scenario-root "$SCENARIO_ROOT" \
            --market-root "$MARKET_ROOT" \
            --output "$RUNNER_TEMP/multifactor-run/history/features.npz"

      - name: Retrain and backtest three scenario rankers
        if: steps.current_features.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE_ROOT/backend"
          uv run python scripts/train_multifactor_stock_pick.py \
            --scenario-root "$SCENARIO_ROOT" \
            --factor-dataset \
              "$RUNNER_TEMP/multifactor-run/history/features.npz" \
            --output-root "$MODEL_RUN_ROOT" \
            --iterations "${{ inputs.iterations || 160 }}"

      - name: Build DIRECT_DEV snapshots
        if: steps.current_features.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE_ROOT/backend"
          uv run python scripts/build_multifactor_shadow_snapshot.py \
            --factor-dataset \
              "$RUNNER_TEMP/multifactor-run/current/features.npz" \
            --model-root "$MODEL_RUN_ROOT" \
            --output-root "$RUNNER_TEMP/multifactor-run/direct-dev" \
            --decision-date "${{ steps.current_features.outputs.decision_date }}" \
            --factor-date "${{ steps.current_features.outputs.factor_date }}" \
            --deployment-state DIRECT_DEV

      - name: Evaluate formal promotion gates
        if: steps.current_features.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE_ROOT/backend"
          uv run python scripts/evaluate_multifactor_release.py \
            --model-root "$MODEL_RUN_ROOT" \
            --output-root "$RUNNER_TEMP/multifactor-run/evaluation"

      - name: Verify Node runtime contracts
        if: steps.current_features.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE_ROOT"
          node --test \
            test/stock-pick-multifactor.test.js \
            test/stock-pick-multifactor-publish.test.js \
            test/stock-pick-ranking-snapshot.test.js \
            test/stock-pick-recall.test.js

      - name: Publish isolated development baseline
        if: >-
          steps.current_features.outputs.ready == 'true'
          && inputs.publish_direct_dev == true
        env:
          MAX_SNAPSHOT_MB: ${{ inputs.max_snapshot_mb || 8 }}
        run: |
          set -euo pipefail
          cd "$WORKSPACE_ROOT"
          snapshot_mb="$(du -sm "$RUNNER_TEMP/multifactor-run/direct-dev" | awk '{print $1}')"
          test "$snapshot_mb" -le "$MAX_SNAPSHOT_MB"
          node scripts/publish-multifactor-dev-snapshots.mjs \
            --input-root "$RUNNER_TEMP/multifactor-run/direct-dev"

      - name: Activate model for daily refresh
        if: >-
          steps.current_features.outputs.ready == 'true'
          && inputs.publish_direct_dev == true
        shell: bash
        run: |
          set -euo pipefail
          pointer="$HOME/.local/share/stock-platform/multifactor-model-current.json"
          temporary="${pointer}.tmp"
          jq -n \
            --arg modelRun "$MODEL_RUN_ROOT" \
            --arg decisionDate "${{ steps.current_features.outputs.decision_date }}" \
            --arg activatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: "multifactor-model-pointer.v1",
              modelRun: $modelRun,
              decisionDate: $decisionDate,
              activatedAt: $activatedAt
            }' > "$temporary"
          mv "$temporary" "$pointer"

      - name: Upload short-lived evaluation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multifactor-stock-pick-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/multifactor-run/evaluation/
          if-no-files-found: warn
          retention-days: 7
