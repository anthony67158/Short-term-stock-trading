name: action-value-factor-data

on:
  workflow_dispatch: {}

concurrency:
  group: action-value-factor-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_DEFAULT_TIMEOUT: "90"
      OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      DATA_ROOT: /mnt/action-value-data
      MARKET_ID: action-value-market-20240102-20260918-v1
      RANKING_ID: action-value-ranking-20240102-20260918-v1
      EPISODE_ID: action-value-episodes-20240401-20260911-v1
      FACTOR_ID: action-value-factors-20240401-20260911-v1
      FACTOR_SOURCE_RELEASE: action-value-factor-source-transfer-20260920
      FACTOR_SOURCE_ASSET: action-value-factor-source-v2.tar.gz.enc
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked data dependencies
        working-directory: backend
        run: uv sync --frozen --group ops --group action-value --dev

      - name: Verify factor data contracts
        working-directory: backend
        run: |
          uv run pytest -q \
            tests/test_multifactor_features.py \
            tests/test_multifactor_source.py \
            tests/test_action_value_factor_dataset.py \
            tests/test_retraining_dataset_store.py
          uv run ruff check \
            src/platform_app/modules/experiments/multifactor_features.py \
            src/platform_app/modules/experiments/multifactor_source.py \
            src/platform_app/modules/experiments/action_value_factor_dataset.py \
            src/platform_app/modules/experiments/retraining_dataset_store.py

      - name: Restore sealed action-value upstreams
        working-directory: backend
        run: |
          sudo mkdir -p "$DATA_ROOT"
          sudo chown "$USER:$USER" "$DATA_ROOT"
          for spec in \
            "market:$MARKET_ID" \
            "ranking:$RANKING_ID" \
            "episode:$EPISODE_ID"
          do
            kind="${spec%%:*}"
            dataset_id="${spec#*:}"
            uv run --group ops python -m \
              platform_app.modules.experiments.retraining_dataset_store restore \
              --root "$DATA_ROOT/$kind" \
              --scope full \
              --kind "$kind" \
              --dataset-id "$dataset_id"
            test -f "$DATA_ROOT/$kind/manifest.json"
          done

      - name: Restore sealed factor dataset when present
        id: restore-factor
        working-directory: backend
        run: |
          uv run --group ops python -m \
            platform_app.modules.experiments.retraining_dataset_store restore \
            --root "$DATA_ROOT/factor" \
            --scope full \
            --kind factor \
            --dataset-id "$FACTOR_ID" \
            --output "$RUNNER_TEMP/factor-restore.json"
          status="$(jq -r .status "$RUNNER_TEMP/factor-restore.json")"
          if [ "$status" = "RESTORED" ]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore encrypted point-in-time source archive
        if: steps.restore-factor.outputs.restored != 'true'
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
          FACTOR_SOURCE_KEY: ${{ secrets.ACTION_VALUE_FACTOR_SOURCE_KEY }}
        run: |
          test -n "$FACTOR_SOURCE_KEY"
          gh release download "$FACTOR_SOURCE_RELEASE" \
            --pattern "$FACTOR_SOURCE_ASSET" \
            --dir "$RUNNER_TEMP/factor-source-transfer"
          printf '%s' "$FACTOR_SOURCE_KEY" | openssl enc \
            -d -aes-256-cbc -pbkdf2 \
            -in "$RUNNER_TEMP/factor-source-transfer/$FACTOR_SOURCE_ASSET" \
            -out "$RUNNER_TEMP/factor-source.tar.gz" \
            -pass stdin
          mkdir -p "$DATA_ROOT/factor-source"
          tar -xzf "$RUNNER_TEMP/factor-source.tar.gz" \
            -C "$DATA_ROOT/factor-source"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from platform_app.modules.experiments.multifactor_source import (
              audit_multifactor_source_archive,
          )

          root = Path(os.environ["DATA_ROOT"]) / "factor-source"
          report = audit_multifactor_source_archive(root)
          if report["state"] != "READY":
              raise SystemExit("ACTION_VALUE_FACTOR_SOURCE_NOT_READY")
          Path(os.environ["RUNNER_TEMP"], "factor-source-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2)
              + "\n"
          )
          PY

      - name: Build and seal action-value factor dataset
        if: steps.restore-factor.outputs.restored != 'true'
        working-directory: backend
        run: |
          uv run python -m \
            platform_app.modules.experiments.action_value_factor_dataset \
            build-dataset \
            --root "$DATA_ROOT/factor" \
            --dataset-id "$FACTOR_ID" \
            --source-root "$DATA_ROOT/factor-source" \
            --episode-root "$DATA_ROOT/episode" \
            --ranking-root "$DATA_ROOT/ranking" \
            --market-root "$DATA_ROOT/market"
          uv run --group ops python -m \
            platform_app.modules.experiments.retraining_dataset_store checkpoint \
            --root "$DATA_ROOT/factor" \
            --scope full \
            --kind factor \
            --dataset-id "$FACTOR_ID" \
            --output "$RUNNER_TEMP/factor-checkpoint.json"

      - name: Verify sealed factor dataset
        working-directory: backend
        run: |
          uv run --group ops python -m \
            platform_app.modules.experiments.retraining_dataset_store audit \
            --root "$DATA_ROOT/factor" \
            --scope full \
            --kind factor \
            --dataset-id "$FACTOR_ID" \
            --output "$RUNNER_TEMP/factor-final.json"
          cp "$DATA_ROOT/factor/manifest.json" \
            "$RUNNER_TEMP/factor-manifest.json"

      - name: Upload factor data diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: action-value-factor-data-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/factor-restore.json
            ${{ runner.temp }}/factor-source-audit.json
            ${{ runner.temp }}/factor-checkpoint.json
            ${{ runner.temp }}/factor-final.json
            ${{ runner.temp }}/factor-manifest.json
            /mnt/action-value-data/factor-source/
          if-no-files-found: warn
          retention-days: 90
