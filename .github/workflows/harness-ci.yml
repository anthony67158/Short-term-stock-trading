name: harness-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --prefer-online

      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: qlib-service/requirements.txt

      - name: Install quant test dependencies
        run: python -m pip install -r qlib-service/requirements.txt

      - name: Run system harness gate
        run: npm run harness:ci

      - name: Run unit and contract tests
        id: unit-tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-artifacts
          set +e
          npm run test:ci \
            2>&1 | tee test-artifacts/node-tests.log
          test_status=${PIPESTATUS[0]}
          {
            echo "## Node test result"
            echo
            if [ "$test_status" -eq 0 ]; then
              echo "PASS"
            else
              echo "FAIL"
              grep '^not ok ' test-artifacts/node-tests.log |
                while IFS= read -r failure; do
                  echo "::error title=Node test failure::$failure"
                done
              diagnostic=$(tail -n 80 test-artifacts/node-tests.log)
              diagnostic=${diagnostic//'%'/'%25'}
              diagnostic=${diagnostic//$'\r'/'%0D'}
              diagnostic=${diagnostic//$'\n'/'%0A'}
              echo "::error file=.github/workflows/harness-ci.yml,line=1,title=Node test diagnostics::$diagnostic"
              echo
              echo '```text'
              awk '/^not ok /,/^  \.\.\.$/' \
                test-artifacts/node-tests.log | tail -n 240
              tail -n 20 test-artifacts/node-tests.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Publish unit test diagnostics
        if: steps.unit-tests.outcome == 'failure'
        shell: bash
        run: |
          diagnostic=$(tail -n 120 test-artifacts/node-tests.log)
          diagnostic=${diagnostic//'%'/'%25'}
          diagnostic=${diagnostic//$'\r'/'%0D'}
          diagnostic=${diagnostic//$'\n'/'%0A'}
          echo "::error file=.github/workflows/harness-ci.yml,line=1,title=Node test diagnostics::$diagnostic"
          exit 1

      - name: Run quant service tests
        shell: bash
        run: |
          python -m unittest discover \
            -s qlib-service/tests -p 'test_*.py' \
            2>&1 | tee test-artifacts/python-tests-nested.log
          python -m unittest discover \
            -s qlib-service -p 'test_*.py' \
            2>&1 | tee test-artifacts/python-tests-root.log

      - name: Build production frontend
        run: npm run build

      - name: Build and smoke-test FC runtime package
        shell: bash
        run: |
          npm run package:fc
          PORT=9010 node .fc-package/server.js \
            > test-artifacts/fc-package.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9010/__health; then
              exit 0
            fi
            sleep 1
          done
          tail -n 120 test-artifacts/fc-package.log
          exit 1

      - name: Upload harness episodes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report-${{ github.run_id }}
          path: |
            harness-artifacts/
            test-artifacts/
          if-no-files-found: error
