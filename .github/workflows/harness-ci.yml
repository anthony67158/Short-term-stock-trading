name: harness-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Prepare diagnostics
        run: mkdir -p test-artifacts

      - name: Run system harness gate
        shell: bash
        run: |
          set -o pipefail
          npm run harness:ci 2>&1 |
            tee test-artifacts/harness.log

      - name: Run unit and contract tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci \
            2>&1 | tee test-artifacts/node-tests.log

      - name: Build production frontend
        run: npm run build

      - name: Build and smoke-test FC runtime package
        shell: bash
        run: |
          npm run package:fc
          PORT=9010 node .fc-package/server.js \
            > test-artifacts/fc-package.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9010/__health; then
              exit 0
            fi
            sleep 1
          done
          tail -n 120 test-artifacts/fc-package.log
          exit 1

      - name: Upload harness episodes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report-${{ github.run_id }}
          path: |
            harness-artifacts/
            test-artifacts/
          if-no-files-found: warn

  python-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_DEFAULT_TIMEOUT: "90"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: qlib-service/requirements-ci.txt

      - name: Install locked quant test dependencies
        run: |
          python -m pip install \
            --retries 5 \
            -r qlib-service/requirements-ci.txt
          python -m pip check

      - name: Prepare diagnostics
        run: mkdir -p test-artifacts

      - name: Run quant service tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover \
            -s qlib-service/tests -p 'test_*.py' \
            2>&1 | tee test-artifacts/python-tests-nested.log
          python -m unittest discover \
            -s qlib-service -p 'test_*.py' \
            2>&1 | tee test-artifacts/python-tests-root.log

      - name: Upload Python test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-report-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: warn
