name: harness-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run system harness gate
        run: npm run harness:ci

      - name: Run unit and contract tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Upload harness episodes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report-${{ github.run_id }}
          path: harness-artifacts/
          if-no-files-found: error
