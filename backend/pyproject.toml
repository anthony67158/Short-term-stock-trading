[project]
name = "a-share-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "argon2-cffi>=23.1",
  "numpy>=2.2,<3",
  "scikit-learn>=1.9,<1.10",
  "joblib>=1.5,<2",
  "mcp>=1.26,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "hypothesis>=6.130", "ruff>=0.11"]

[project.scripts]
platform-cli = "platform_app.entrypoints.cli:main"
stock-search-mcp = "platform_app.entrypoints.doubao_search_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
